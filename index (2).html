<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Cadastro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <!-- coluna do formulario -->
    <div class="coluna">
      <h1>Cadastro</h1>

      <form id="cadastroForm" novalidate>
        <div class="campo">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" placeholder="Digite seu nome completo" required>
          <span class="erro" id="erroNome"></span>
        </div>

        <div class="campo">
          <label for="email">E-mail Institucional</label>
          <input type="email" id="email" placeholder="exemplo@escola.com.br" required>
          <span class="erro" id="erroEmail"></span>
        </div>

        <div class="campo">
          <label for="senha">Senha de Acesso</label>
          <input type="password" id="senha" placeholder="Mínimo 6 caracteres" minlength="6" required>
          <span class="erro" id="erroSenha"></span>
        </div>

        <div class="campo">
          <label for="confirmaSenha">Confirmação de Senha</label>
          <input type="password" id="confirmaSenha" placeholder="Digite a senha novamente" required>
          <span class="erro" id="erroConfirma"></span>
        </div>

        <div class="campo">
          <label for="perfil">Perfil Técnico</label>
          <select id="perfil" required>
            <option value="">Selecione...</option>
            <option value="Redes">Redes</option>
            <option value="Desenvolvimento">Desenvolvimento</option>
            <option value="Suporte">Suporte</option>
          </select>
          <span class="erro" id="erroPerfil"></span>
        </div>

        <div class="campo">
          <label class="check">
            <input type="checkbox" id="termos" required>
            Aceito os Termos de Uso
          </label>
          <span class="erro" id="erroTermos"></span>
        </div>

        <button type="submit">Cadastrar</button>
      </form>
    </div>

    <!-- coluna de saida -->
    <div class="coluna">
      <h2>Dados Cadastrados</h2>
      <p id="mensagemSucesso" class="sucesso" hidden>Cadastro realizado com sucesso!</p>

      <dl>
        <dt>Nome</dt>
        <dd id="saidaNome">-</dd>
        <dt>E-mail</dt>
        <dd id="saidaEmail">-</dd>
        <dt>Perfil Técnico</dt>
        <dd id="saidaPerfil">-</dd>
        <dt>Termos de Uso</dt>
        <dd id="saidaTermos">-</dd>
      </dl>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
